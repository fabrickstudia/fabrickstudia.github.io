[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/api/chat/send"
  to = "/.netlify/functions/chat"
  status = 200

[[redirects]]
  from = "/api/chat/messages"
  to = "/.netlify/functions/chat"
  status = 200

[[redirects]]
  from = "/api/telegram-webhook"
  to = "/.netlify/functions/telegram-webhook"
  status = 200
